<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAAG-1110 — быстрое добавление в корзину из каталога</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
/*
VOICE: MAAG как в макете Figma «1440 - catalog» / «360 - catalog»: белый, чёрный, Helvetica Neue Light, капслок.
IDEA: «+» на карточке открывает выбор цвета и размера; тап по размеру сразу кладёт товар в корзину.
      Десктоп — панель на нижней кромке фото, мобильный — нижняя шторка с затемнением.
PICTURE: фото 692×985 (на 360 — 160×226), цвет на карточке — квадрат 8px и «+N».
COLOUR and TYPE: #fff / #000 / #ccc / #efefef / #f5f500 (скидка); 10/14, 12/18, 14/20 — Light.
LAYOUT: десктоп — 2 колонки с зазором 8, поля 24; 360 — 2 колонки 160, поля 16, зазор 8.
*/
:root{color-scheme:light;--black:#000;--white:#fff;--gray:#ccc;--ph:#efefef;--mute:#8e8e8e;--sale:#f5f500;--side:141px;--edge:24px}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--white);color:var(--black);font-family:"Helvetica Neue",Helvetica,Inter,Arial,sans-serif;font-weight:300;overflow-x:clip}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-transform:inherit;letter-spacing:inherit}
img{display:block}
:focus-visible{outline:1px solid var(--black);outline-offset:3px}
.t10{font-size:10px;line-height:14px;letter-spacing:.4px;text-transform:uppercase}
.t12{font-size:12px;line-height:18px;letter-spacing:.48px;text-transform:uppercase}
.t14{font-size:14px;line-height:20px;letter-spacing:.56px;text-transform:uppercase}
/* placeholder for a missing exported asset */
.miss{background:var(--ph)}

/* header — desktop */
.hdr{position:sticky;top:0;z-index:5;height:94px;background:var(--white)}
.burger{position:absolute;left:var(--edge);top:16px;width:40px;height:40px}
.burger img{width:40px;height:40px}
.logo{position:absolute;left:var(--side);top:24px;width:179px;height:50px}
.logo img{width:179px;height:50px}
.logo .txt{display:none;font-size:56px;line-height:50px;letter-spacing:-1px}
.logo.miss{background:none}.logo.miss img{display:none}.logo.miss .txt{display:block}
.tools{position:absolute;right:var(--edge);top:24px;display:flex;gap:16px;align-items:center}
.search{width:240px;height:24px;border:.5px solid var(--black);padding:0 8px;display:flex;align-items:center;font-size:12px;line-height:18px;letter-spacing:.24px;text-transform:uppercase}
.ico{position:relative;display:block;width:24px;height:24px}
.ico img{width:24px;height:24px}
.badge{position:absolute;left:16px;top:0;width:13px;height:13px;border:1px solid var(--white);border-radius:6.5px;background:var(--black);color:var(--white);font-weight:400;font-size:12px;line-height:10px;letter-spacing:-.48px;text-align:center;padding-top:1px;overflow:hidden}
.badge[hidden]{display:none}
.badge.bump{animation:bump .3s ease-out}
@keyframes bump{50%{transform:scale(1.35)}}

/* header — 360 */
.mh{display:none;position:sticky;top:0;z-index:5;height:48px;background:var(--white)}
.mh .burger{left:8px;top:4px}
.mh .mlogo{position:absolute;left:72px;top:11px;width:94px;height:26px}
.mh .mlogo img{width:94px;height:26px}
.mh .mtools{position:absolute;right:8px;top:12px;display:flex;gap:12px;align-items:center}
.mh .mtools span{width:24px;height:24px;display:flex;align-items:center;justify-content:center}

/* catalog head: title, chips, sort, view icons */
.head{padding:24px var(--edge) 0 var(--side)}
.head h1{margin:0 0 12px;font-weight:300}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding-bottom:16px}
.chip{height:24px;padding:1px 7px 2px;display:flex;align-items:center;border:.5px solid var(--gray);background:var(--white);white-space:nowrap}
.chip.on{background:var(--black);border-color:var(--black);color:var(--white)}
.sortrow{display:flex;justify-content:space-between;align-items:flex-start}
.sort{display:flex;gap:12px;align-items:center;padding-bottom:16px}
.sort button{position:relative;padding:1px 0;opacity:.5}
.sort button.on{opacity:1}
.sort button.on::after{content:"";position:absolute;left:50%;bottom:-1px;width:14px;height:.5px;margin-left:-7px;background:var(--black)}
.views{display:flex;gap:8px;align-items:flex-start;padding-left:32px}
.views button{display:block;width:28px;height:28px}
.views svg{display:block;fill:none;stroke:var(--black);stroke-width:.5}
.views .m{display:none}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 8px;padding:2px var(--edge) 80px}
.card{position:relative;display:flex;flex-direction:column;gap:16px}
.card .img{position:relative;display:block;aspect-ratio:692/985;overflow:hidden}
.card .img>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.info{display:flex;gap:4px;align-items:flex-start}
.tp{flex:1;display:flex;flex-direction:column;gap:10px}
.tp .name{display:block}
.price{display:flex;gap:4px;align-items:flex-start;height:20px}
.price s{text-decoration:none;position:relative}
.price s::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:.5px solid var(--black)}
.price .sale{background:var(--sale);padding:0 4px}
.clr{display:flex;gap:4px;align-items:flex-end;font-size:10px;line-height:14px;letter-spacing:.4px}
.clr i{display:block;width:8px;height:8px;margin-bottom:2px;border:.5px solid var(--gray)}
.btns{display:flex;align-items:center}
.btns button{display:block;width:20px;height:20px}
.btns img{width:20px;height:20px}
.card[data-st="picking"] .btns .add img{transform:rotate(45deg)}
.btns .add img{transition:transform .15s}

/* overlay panel (desktop): colour + size on the lower edge of the photo */
.panel,.done{position:absolute;left:0;right:0;bottom:0;display:none;background:var(--white);border:.5px solid var(--black)}
.card[data-st="picking"] .panel{display:block}
.card[data-st="added"] .done{display:flex}
.sec{display:flex;flex-direction:column;gap:7px;align-items:center;padding:16px}
.sec+.sec{padding-top:0}
.sec .lbl{font-size:10px;line-height:14px;letter-spacing:.4px;text-transform:uppercase;width:100%;text-align:center}
.sw,.sz{display:flex;gap:4px;align-items:center;justify-content:center;flex-wrap:wrap}
.sw button{display:flex;align-items:center;justify-content:center;padding:8px;border:.5px solid transparent}
.sw button.on{border-color:var(--black)}
.sw i{display:block;width:16px;height:16px;border:.5px solid var(--gray)}
.sw button.out i{background-image:linear-gradient(to top right,transparent calc(50% - .5px),var(--black) calc(50% - .5px),var(--black) calc(50% + .5px),transparent calc(50% + .5px))}
.sz button{display:flex;align-items:center;justify-content:center;height:32px;min-width:32px;padding:6px 2px;background:var(--white);border:.5px solid var(--gray);font-size:14px;line-height:20px;letter-spacing:.56px;text-transform:uppercase;text-align:center}
.sz button:hover:not(:disabled){border-color:var(--black)}
.sz button:disabled{background:var(--ph);border-color:var(--ph);color:var(--mute);cursor:default}
.done{align-items:center;justify-content:center;gap:20px;padding:10px 16px;font-size:12px;line-height:18px;text-transform:none}
.done .ok{display:flex;gap:4px;align-items:center;letter-spacing:.24px;white-space:nowrap}
.done .ok img{width:20px;height:20px}
.done button{letter-spacing:.48px;text-transform:uppercase;white-space:nowrap}

/* bottom sheet (360) */
.dim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:480px;margin:0 auto;background:var(--white);padding:16px;display:flex;flex-direction:column;gap:16px;transform:translateY(100%);visibility:hidden;transition:transform .25s cubic-bezier(.4,0,.2,1),visibility .25s}
body.sheet-open .dim{opacity:1;visibility:visible}
body.sheet-open .sheet{transform:none;visibility:visible}
.sheet .top{position:relative;display:flex;gap:16px;align-items:flex-start;width:100%}
.sheet .thumb{position:relative;flex:none;width:128px;height:180px;overflow:hidden}
.sheet .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sheet .meta{flex:1;align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;padding:4px 32px 0 0}
.sheet .meta b{font-weight:700;font-size:12px;line-height:18px;letter-spacing:.48px;text-transform:uppercase}
.sheet .meta span{font-size:10px;line-height:14px;letter-spacing:.4px}
.sheet .x{position:absolute;right:0;top:1px;width:24px;height:24px}
.sheet .x img{width:24px;height:24px}
.sheet .sec{align-items:flex-start;padding:0;gap:7px}
.sheet .sec+.sec{padding:0}
.sheet .sec .lbl{text-align:left}
.sheet .sw,.sheet .sz{justify-content:flex-start;flex-wrap:nowrap}
.sheet .sw button{padding:8px}
.sheet .sz button{font-size:14px}
.sheet .donebar{display:flex;align-items:center;gap:30px;height:53px;padding-bottom:6px;align-items:flex-end;font-size:12px;line-height:18px}
.sheet .donebar .ok{display:flex;gap:4px;align-items:center;letter-spacing:.24px;white-space:nowrap}
.sheet .donebar .ok img{width:20px;height:20px}
.sheet .donebar .acts{display:flex;gap:16px;align-items:center;text-transform:uppercase;letter-spacing:.48px;white-space:nowrap}

@media(max-width:1100px){:root{--side:var(--edge)}.logo{left:72px}}
@media(max-width:760px){
  :root{--edge:16px}
  .hdr{display:none}.mh{display:block}
  .head{padding:24px var(--edge) 0}
  .head h1{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
  .head h1 .views{padding:0;gap:6px}
  .sortrow .views{display:none}
  .views .d{display:none}.views .m{display:block}
  .views button{width:20px;height:20px}
  .chips{padding-bottom:8px}
  .chip{padding:2px 7px;font-size:10px;line-height:16px;letter-spacing:.4px}
  .sort{gap:8px;padding:10px 0 18px}
  .sort button{font-size:10px;line-height:16px;letter-spacing:.4px}
  .grid{gap:24px 8px;padding-top:0}
  .card{gap:8px}
  .card .img{aspect-ratio:160/225.77}
  .panel,.done{display:none!important}
  .tp{gap:8px}
  .name{font-size:10px;line-height:14px;letter-spacing:.4px}
  .price{height:auto;font-size:11px;line-height:14px;letter-spacing:.44px}
  .price .sale{padding:0 2px}
  .price,.price span,.price s{font-size:11px;line-height:14px;letter-spacing:.44px}
  .info{gap:0}
  .btns{flex-direction:column;gap:4px;align-items:flex-start;justify-content:center;padding:0 4px}
  .grid.one{grid-template-columns:minmax(0,1fr)}
  .grid.one .card .img{aspect-ratio:328/463}
  .grid.one .card .name{font-size:12px;line-height:18px;letter-spacing:.48px}
}
@media(min-width:761px){.dim,.sheet{display:none}}
@media(prefers-reduced-motion:reduce){.sheet,.dim,.btns .add img{transition:none}.badge.bump{animation:none}}
</style>
</head>
<body>
<header class="hdr">
  <button class="burger" aria-label="Меню"><img data-src="assets/nav.svg" alt=""></button>
  <a class="logo" href="#" aria-label="MAAG"><img data-src="assets/logo.svg" alt="MAAG"><span class="txt">MAAG</span></a>
  <div class="tools">
    <div class="search">Поиск</div>
    <a class="ico" href="#" aria-label="Магазины"><img data-src="assets/location.svg" alt=""></a>
    <a class="ico" href="#" aria-label="Профиль"><img data-src="assets/profile.svg" alt=""></a>
    <a class="ico" href="#" aria-label="Корзина"><img data-src="assets/cart.svg" alt=""><span class="badge" id="badge" hidden aria-live="polite">0</span></a>
  </div>
</header>
<header class="mh">
  <button class="burger" aria-label="Меню"><img data-src="assets/nav.svg" alt=""></button>
  <a class="mlogo" href="#" aria-label="MAAG"><img data-src="assets/logo-mobile.svg" alt="MAAG"></a>
  <div class="mtools">
    <span><img data-src="assets/search.svg" alt="Поиск"></span>
    <span><img data-src="assets/location.svg" alt="Магазины"></span>
  </div>
</header>

<main>
  <section class="head">
    <h1 class="t14">woman
      <span class="views" aria-label="Вид сетки">
        <button class="m" data-cols="2" aria-label="Две колонки" aria-pressed="true"><svg width="20" height="20" viewBox="0 0 20 20"><rect x="2" y="1" width="16" height="16"/><path d="M5 19.5h10"/></svg></button>
        <button class="m" data-cols="1" aria-label="Одна колонка" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 20 20"><rect x="2" y="1" width="7.33" height="7.33"/><rect x="2" y="9.67" width="7.33" height="7.33"/><rect x="10.67" y="9.67" width="7.33" height="7.33"/><rect x="10.67" y="1" width="7.33" height="7.33"/></svg></button>
      </span>
    </h1>
    <div class="chips t12">
      <a class="chip on" href="#">View all</a><a class="chip" href="#">Wide leg</a><a class="chip" href="#">Extra wide leg</a><a class="chip" href="#">Balloon</a><a class="chip" href="#">Slim</a><a class="chip" href="#">Straight</a><a class="chip" href="#">Marine</a><a class="chip" href="#">Boyfriend</a><a class="chip" href="#">Flare</a>
    </div>
    <div class="sortrow">
      <div class="sort t12"><button class="on">recommended</button><button>new</button><button>low price</button><button>high price</button></div>
      <span class="views">
        <button class="d" aria-label="Крупно"><svg width="28" height="28" viewBox="0 0 28 28"><rect x="2" y="0" width="24" height="24"/><path d="M7 27.25h14"/></svg></button>
        <button class="d" aria-label="Средне"><svg width="28" height="28" viewBox="0 0 28 28"><rect x="2" y="0" width="11" height="11"/><rect x="2" y="13" width="11" height="11"/><rect x="15" y="13" width="11" height="11"/><rect x="15" y="0" width="11" height="11"/></svg></button>
        <button class="d" aria-label="Мелко"><svg width="28" height="28" viewBox="0 0 28 28"><rect x="2" y="0" width="7" height="11"/><rect x="2" y="13" width="7" height="11"/><rect x="11" y="0" width="7" height="11"/><rect x="11" y="13" width="7" height="11"/><rect x="20" y="0" width="7" height="11"/><rect x="20" y="13" width="7" height="11"/></svg></button>
      </span>
    </div>
  </section>
  <div class="grid" id="grid"></div>
</main>

<div class="dim" id="dim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Быстрое добавление в корзину"></div>

<script>
{
const SIZES=['XS','S','M','L','XL','XXL','XXXL'];
/* per-colour stock: the backend would give photo + sizes for each colour */
const COLORS=[
  {c:'#a29bcb',n:'Лавандовый',out:['XS']},
  {c:'#ffffff',n:'Белый',out:['XS','S']},
  {c:'#d3a5a5',n:'Розовый',out:[]},
  {c:'#efe8b9',n:'Светло-жёлтый',out:['XXXL']},
  {c:'#8b8b8b',n:'Серый',out:['XS','XXL']}
];
const photos=['p5','p6','p1','p2','p3','p4','p5','p6'];
const TITLE='Сапоги трубы фантазийные на каблуке';
const cards=photos.map(p=>({img:`assets/${p}.jpg`,color:0,st:'idle',size:null,t:0}));
let count=0,openIdx=-1,cols=2;
const $=s=>document.querySelector(s),grid=$('#grid'),sheet=$('#sheet'),badge=$('#badge');
const mob=()=>matchMedia('(max-width:760px)').matches;

const swatches=(c,ci)=>`<div class="sw" role="radiogroup" aria-label="Цвет">${COLORS.map((k,i)=>`<button role="radio" aria-checked="${i===c.color}" aria-label="${k.n}${k.out.length===SIZES.length?', нет в наличии':''}" class="${i===c.color?'on':''}${k.out.length===SIZES.length?' out':''}" data-act="color" data-i="${ci}" data-c="${i}"><i style="background:${k.c}"></i></button>`).join('')}</div>`;
const sizes=(c,ci)=>`<div class="sz">${SIZES.map(s=>`<button data-act="size" data-i="${ci}" data-s="${s}"${COLORS[c.color].out.includes(s)?' disabled aria-label="'+s+', нет в наличии"':''}>${s}</button>`).join('')}</div>`;
const pick=(c,ci)=>`<div class="sec"><span class="lbl">Цвет</span>${swatches(c,ci)}</div><div class="sec"><span class="lbl">Размер</span>${sizes(c,ci)}</div>`;

const cardHtml=(c,i)=>`<article class="card" data-i="${i}" data-st="${c.st}">
  <a class="img" href="#"><img data-src="${c.img}" alt="">
    <div class="panel" data-stop></div>
    <div class="done" data-stop><span class="ok"><img data-src="assets/icon-check.svg" alt=""><span>Добавлено · <b class="sz-l" style="font-weight:300"></b></span></span><button data-act="undo" data-i="${i}">Отменить</button></div>
  </a>
  <div class="info"><div class="tp">
    <div><a class="name t14" href="#">${TITLE}</a><div class="price t14"><s>7 999 ₽</s><span class="sale">7 999 ₽</span></div></div>
    <div class="clr"><i></i><span class="more"></span></div>
  </div>
  <div class="btns"><button class="add" data-act="add" data-i="${i}" aria-label="Добавить в корзину" aria-expanded="false"><img data-src="assets/icon-add.svg" alt=""></button><button aria-label="В избранное"><img data-src="assets/like.svg" alt=""></button></div></div>
</article>`;

function loadImgs(root){root.querySelectorAll('img[data-src]').forEach(img=>{
  const slot=img.closest('.logo,.mlogo,.img,.thumb,.ico')||img;
  img.onerror=()=>{slot.classList.add('miss');img.style.visibility='hidden'};
  img.src=img.dataset.src;img.removeAttribute('data-src')})}

function paintCard(i){
  const c=cards[i],el=grid.children[i];
  el.dataset.st=c.st;
  el.querySelector('.clr i').style.background=COLORS[c.color].c;
  el.querySelector('.more').textContent='+2'; /* как в макете */
  el.querySelector('.panel').innerHTML=pick(c,i);
  el.querySelector('.sz-l').textContent=c.size||'';
  el.querySelector('.add').setAttribute('aria-expanded',c.st==='picking');
}
function paintBadge(bump){
  badge.hidden=!count;badge.textContent=count;
  if(bump&&count){badge.classList.remove('bump');void badge.offsetWidth;badge.classList.add('bump')}
}
function paintSheet(){
  const c=cards[openIdx];
  if(!c){document.body.classList.remove('sheet-open','lock');return}
  const head=`<div class="top"><div class="thumb"><img src="${c.img}" alt=""></div><div class="meta"><b>${TITLE}</b><span class="t10">7 999 ₽</span></div><button class="x" data-act="close" aria-label="Закрыть"><img src="assets/close.svg" alt=""></button></div>`;
  sheet.innerHTML=head+(c.st==='added'
    ?`<div class="donebar"><span class="ok"><img src="assets/icon-check.svg" alt=""><span>Добавлено · ${c.size}</span></span><span class="acts"><button data-act="undo" data-i="${openIdx}">Отменить</button><a href="#" data-act="cart">В корзину</a></span></div>`
    :pick(c,openIdx));
  document.body.classList.add('sheet-open','lock');
}
function close(i){
  if(i<0)return;
  const c=cards[i];
  if(c.st==='picking'){c.st='idle';paintCard(i)}
  if(openIdx===i){openIdx=-1;paintSheet()}
}
function openCard(i){
  if(openIdx>=0&&openIdx!==i)close(openIdx);
  cards.forEach((c,j)=>{if(j!==i&&c.st==='picking'){c.st='idle';paintCard(j)}});
  const c=cards[i];
  if(c.st==='picking'){close(i);return}
  clearTimeout(c.t);c.st='picking';paintCard(i);
  if(mob()){openIdx=i;paintSheet()}
}
function add(i,s){
  const c=cards[i];
  c.size=s;c.st='added';count++;paintCard(i);paintBadge(true);
  if(mob())paintSheet();
  else{clearTimeout(c.t);c.t=setTimeout(()=>{if(c.st==='added'){c.st='idle';paintCard(i)}},4500)}
}
function undo(i){
  const c=cards[i];
  if(c.st!=='added')return;
  clearTimeout(c.t);count=Math.max(0,count-1);c.st='idle';c.size=null;paintCard(i);paintBadge();
  if(openIdx===i){openIdx=-1;paintSheet()}
}
function pickColor(i,k){const c=cards[i];c.color=k;paintCard(i);if(openIdx===i)paintSheet()}

function render(){
  grid.classList.toggle('one',cols===1);
  grid.innerHTML=cards.map(cardHtml).join('');
  cards.forEach((_,i)=>paintCard(i));
  loadImgs(grid);
}
render();loadImgs(document);

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b){
    e.preventDefault();e.stopPropagation();
    const i=+b.dataset.i,a=b.dataset.act;
    if(a==='add')openCard(i);
    else if(a==='color')pickColor(i,+b.dataset.c);
    else if(a==='size')add(i,b.dataset.s);
    else if(a==='undo')undo(i);
    else if(a==='close')close(openIdx);
    return;
  }
  if(e.target.closest('.panel,.done'))return e.preventDefault();
  if(e.target===$('#dim'))close(openIdx);
  /* outside click closes an open desktop panel */
  if(!e.target.closest('.card'))cards.forEach((c,j)=>{if(c.st==='picking'){c.st='idle';paintCard(j)}});
  if(e.target.closest('.img,.name,.chip,.logo,.mlogo,.ico,.sort button')===null)return;
  if(e.target.closest('a[href="#"]'))e.preventDefault();
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(openIdx>=0)close(openIdx);
  else cards.forEach((c,j)=>{if(c.st==='picking'){c.st='idle';paintCard(j)}});
});
document.querySelectorAll('.views .m').forEach(b=>b.addEventListener('click',()=>{
  cols=+b.dataset.cols;
  document.querySelectorAll('.views .m').forEach(x=>x.setAttribute('aria-pressed',x===b));
  grid.classList.toggle('one',cols===1);
}));
document.querySelectorAll('.sort button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.sort button').forEach(x=>x.classList.toggle('on',x===b));
}));
matchMedia('(max-width:760px)').addEventListener('change',()=>{
  cards.forEach((c,j)=>{if(c.st==='picking'){c.st='idle';paintCard(j)}});
  openIdx=-1;paintSheet();
});
}
</script>
</body>
</html>
