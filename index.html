<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дизайн-прототипы</title>
<style>
:root{--black:#000;--white:#fff;--line:#e0e0e0;--side:40px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--white);color:var(--black);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:400;font-size:14px;line-height:20px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--black);outline-offset:3px}

.wrap{padding:40px var(--side);max-width:720px}
.tabs{display:flex;gap:20px;margin-bottom:24px}
.tabs button{padding:0 0 2px;border-bottom:1px solid transparent}
.tabs button[aria-selected="true"]{border-bottom-color:var(--black)}
.tabs button:hover{border-bottom-color:var(--line)}
.tabs button[aria-selected="true"]:hover{border-bottom-color:var(--black)}

.panel[hidden]{display:none}
.task{display:block;padding:6px 0}
.task a:hover{text-decoration:underline}

@media (max-width:600px){:root{--side:16px}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="tabs" role="tablist" aria-label="Проекты">
    <button role="tab" id="tab-maag" aria-controls="panel-maag" aria-selected="true">MAAG</button>
    <button role="tab" id="tab-vilet" aria-controls="panel-vilet" aria-selected="false" tabindex="-1">VILET</button>
  </nav>

  <section class="panel" id="panel-maag" role="tabpanel" aria-labelledby="tab-maag">
    <div class="task"><a class="id" href="https://jira.awg.ru/browse/MAAG-1110" target="_blank" rel="noopener">MAAG-1110</a>: <a href="maag-1110/">Задизайнить флоу быстрого добавления в корзину товара из каталога</a></div>
    <div class="task"><a class="id" href="https://jira.awg.ru/browse/MAAG-1115" target="_blank" rel="noopener">MAAG-1115</a>: <a href="maag-1115/">Редизайн футера</a></div>
  </section>

  <section class="panel" id="panel-vilet" role="tabpanel" aria-labelledby="tab-vilet" hidden>
    <div class="task"><a class="id" href="https://jira.awg.ru/browse/VILET-132" target="_blank" rel="noopener">VILET-132</a>: <a href="vilet-132/">Редизайн латерального меню</a></div>
  </section>
</div>

<script>
(function(){
  var tabs=[].slice.call(document.querySelectorAll('[role=tab]'));
  function select(tab,push){
    tabs.forEach(function(t){
      var on=t===tab;
      t.setAttribute('aria-selected',on);
      t.tabIndex=on?0:-1;
      document.getElementById(t.getAttribute('aria-controls')).hidden=!on;
    });
    if(push)history.replaceState(null,'','#'+tab.id.replace('tab-',''));
  }
  tabs.forEach(function(t,i){
    t.addEventListener('click',function(){select(t,true)});
    t.addEventListener('keydown',function(e){
      var d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;
      if(!d)return;
      var n=tabs[(i+d+tabs.length)%tabs.length];n.focus();select(n,true);
    });
  });
  var t=document.getElementById('tab-'+location.hash.slice(1));
  if(t)select(t,false);
})();
</script>
</body>
</html>
